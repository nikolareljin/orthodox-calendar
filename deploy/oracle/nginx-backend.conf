# nginx reverse proxy for the Orthodox Calendar FastAPI backend.
# HTTP only — run certbot after pointing a domain here to upgrade to HTTPS.
#
#   sudo certbot --nginx -d api.your-domain.com
#
server {
    listen 80;
    listen [::]:80;
    server_name _;       # accepts any hostname / raw IP; certbot will replace this

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Proxy to uvicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Healthcheck shortcut (nginx ↔ HAProxy / load balancer, no backend hit)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
