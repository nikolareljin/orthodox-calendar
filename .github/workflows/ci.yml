name: CI

on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  gitleaks:
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      fail_on_findings: true

  frontend-scan:
    uses: nikolareljin/ci-helpers/.github/workflows/react-scan.yml@production
    with:
      working_directory: frontend
      node_version: "22"
      install_command: "npm ci"
      lint_command: ""
      test_command: ""
      build_command: "npm run build"
      audit_command: "npm audit --audit-level=high"

  backend-scan:
    uses: nikolareljin/ci-helpers/.github/workflows/python-scan.yml@production
    with:
      working_directory: backend
      python_version: "3.12"

  data-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nikolareljin/ci-helpers/.github/actions/data-safety-scan@production
        with:
          scan_path: backend/app/data
