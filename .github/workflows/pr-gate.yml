name: PR Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_scans: ${{ steps.filter.outputs.run_scans }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_scans=false
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md)
                ;;
              *)
                run_scans=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "run_scans=$run_scans" >> "$GITHUB_OUTPUT"

  gitleaks:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      fail_on_findings: true

  frontend-scan:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    uses: nikolareljin/ci-helpers/.github/workflows/react-scan.yml@production
    with:
      working_directory: frontend
      node_version: "22"
      install_command: "npm ci"
      lint_command: ""
      test_command: ""
      build_command: "npm run build"
      audit_command: "npm audit --audit-level=high"

  backend-scan:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    uses: nikolareljin/ci-helpers/.github/workflows/python-scan.yml@production
    with:
      working_directory: backend
      python_version: "3.12"
      # Pinned. ruff.toml fixes the rule *selection*; this fixes the tool.
      # Without both, a new ruff release can still change what existing
      # rules flag and break a gate nobody touched -- which is exactly how
      # 366 findings appeared here in a green repository.
      lint_command: "python -m pip install ruff==0.16.1 && ruff check ."

  # scripts/ was covered by nothing.
  #
  # backend-scan is scoped to working_directory: backend, so `ruff check .` and
  # pytest both stop at that directory. scripts/ holds the import pipeline --
  # the code that decides which saint lands on which day -- plus 19 tests that
  # no job has ever run. The `scripts/*` entry in ruff.toml was dead config for
  # the same reason: nothing linted the path it names.
  #
  # A green tick that covers half a repository is worse than a red one, because
  # it gets trusted.
  scripts-scan:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    uses: nikolareljin/ci-helpers/.github/workflows/python-scan.yml@production
    with:
      working_directory: .
      python_version: "3.12"
      install_command: "python -m pip install pytest"
      # Same pin as backend-scan; the two must move together.
      lint_command: "python -m pip install ruff==0.16.1 && ruff check scripts/"
      unit_command: "python -m pytest scripts/tests -q"

  data-safety:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nikolareljin/ci-helpers/.github/actions/data-safety-scan@production
        with:
          scan_path: backend/app/data

  pr-gate:
    needs: [changes, gitleaks, frontend-scan, backend-scan, scripts-scan, data-safety]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require completed scan jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_SCANS: ${{ needs.changes.outputs.run_scans }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-scan.result }}
          BACKEND_RESULT: ${{ needs.backend-scan.result }}
          SCRIPTS_RESULT: ${{ needs.scripts-scan.result }}
          DATA_SAFETY_RESULT: ${{ needs.data-safety.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]] || exit 1
          if [[ "$RUN_SCANS" != "true" ]]; then
            echo "Documentation-only PR: scan jobs intentionally skipped."
            exit 0
          fi

          for result in \
            "$GITLEAKS_RESULT" \
            "$FRONTEND_RESULT" \
            "$BACKEND_RESULT" \
            "$SCRIPTS_RESULT" \
            "$DATA_SAFETY_RESULT"; do
            [[ "$result" == "success" ]] || exit 1
          done
          echo "PR gate checks passed."
