name: PR Gate

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_scans: ${{ steps.filter.outputs.run_scans }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_scans=false
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md)
                ;;
              *)
                run_scans=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "run_scans=$run_scans" >> "$GITHUB_OUTPUT"

  gitleaks:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      fail_on_findings: true

  frontend-scan:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    uses: nikolareljin/ci-helpers/.github/workflows/react-scan.yml@production
    with:
      working_directory: frontend
      node_version: "22"
      install_command: "npm ci"
      lint_command: ""
      test_command: ""
      build_command: "npm run build"
      audit_command: "npm audit --audit-level=high"

  backend-scan:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    uses: nikolareljin/ci-helpers/.github/workflows/python-scan.yml@production
    with:
      working_directory: backend
      python_version: "3.12"

  data-safety:
    needs: changes
    if: needs.changes.outputs.run_scans == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject sensitive keys in data files
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            if grep -qiE '"(api_key|api_secret|password|passwd|token|secret|auth|cookie|session|credential|private_key)"\s*:' "$f"; then
              echo "::error::Potentially sensitive key found in $f"
              found=1
            fi
          done < <(find backend/app/data -type f -name '*.json' -print0)
          [[ $found -eq 0 ]] || exit 1
          echo "Data safety check passed."
