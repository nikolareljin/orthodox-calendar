name: Deploy

on:
  # Every push to main runs release-check as a lightweight no-op (~5 s) for
  # non-release pushes; only a merged release/* PR sets is_release=true and
  # unlocks the security gate and deploy stages.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

# Opt into Node.js 24 for JS actions; Node 20 is fully removed from runners Sep 2026.
# TODO: Remove after 2026-06-02 — GitHub makes Node 24 the default for JS actions
#       runner-wide on that date, making this override redundant.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
# ── Stage 0: detect if push came from a merged release/* PR ──────────────────
  release-check:
    # Skip on force-pushes: a forced push can replay an old release merge SHA
    # and trigger an unintended re-deploy of a past version.
    if: github.event.forced != true
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Detect merged release/* PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          is_release="false"

          # Primary: GitHub API — reliable for standard and squash merges.
          # On transient API failure fall through to the commit-message check.
          count=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release/")))] | length' \
            2>/dev/null) \
            || { echo "::warning::gh api call failed; relying on commit-message fallback" >&2; count=0; }
          if [[ "${count}" -gt 0 ]]; then
            is_release="true"
          elif echo "${HEAD_COMMIT_MSG}" | grep -qE '^Merge pull request #[0-9]+ from [^/]+/release/'; then
            # Fallback: merge-commit subject — redundant guard for the standard
            # merge strategy. Pattern anchors release/ immediately after the
            # owner segment, matching the API's startswith("release/") check.
            # Squash/rebase subjects do not match this pattern.
            is_release="true"
          fi

          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"
          echo "Release deploy: ${is_release}"

# ── Stage 1: security gate (runs only on release merges) ─────────────────────
  security:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check]
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      fail_on_findings: true

  data-safety:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject sensitive keys in data files
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            if grep -qiE '"(api_key|api_secret|password|passwd|token|secret|auth|cookie|session|credential|private_key)"\s*:' "$f"; then
              echo "::error::Potentially sensitive key found in $f"
              found=1
            fi
          done < <(find backend/app/data -type f -name '*.json' -print0)
          [[ $found -eq 0 ]] || exit 1
          echo "Data safety check passed."

# ── Stage 2: auto-tag (version tag from release/* branch name) ───────────────
# auto-tag-release.yml uses context.sha + listPullRequestsAssociatedWithCommit
# (not github.event.pull_request), so it works correctly under a push event.
  tag:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, security, data-safety]
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag-release.yml@production
    with:
      update_production_tag: false

# ── Stage 2: backend → Oracle Cloud (parallel with frontend build) ────────────
  backend-deploy:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, security, data-safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH agent
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.OCI_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Build minimal backend deployment archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/orthodox-calendar-backend.tar.gz \
              --exclude='*/__pycache__' \
              --exclude='*.py[co]' \
              backend/app \
              backend/requirements.txt

      - name: Deploy backend to Oracle Cloud
        shell: bash
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              /tmp/orthodox-calendar-backend.tar.gz \
              "${OCI_USER}@${OCI_HOST}:/tmp/orthodox-calendar-backend.tar.gz"
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${OCI_USER}@${OCI_HOST}" \
              'APP_DIR=/home/'"${OCI_USER}"'/orthodox-calendar RELEASE_ARCHIVE=/tmp/orthodox-calendar-backend.tar.gz bash -s' \
              < deploy/oracle/deploy.sh

      - name: Verify backend health
        shell: bash
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          set -euo pipefail
          url="${VITE_API_BASE}/health"
          echo "Checking ${url}"
          for i in $(seq 1 6); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" "${url}" 2>/dev/null || echo "000")
            if [[ "${status}" == "200" ]]; then
              echo "Backend healthy (HTTP ${status})"
              exit 0
            fi
            echo "Attempt ${i}/6 — HTTP ${status}, waiting 10 s"
            sleep 10
          done
          echo "::error::Backend health check failed after 60 s"
          exit 1

# ── Stage 2: frontend → GitHub Pages ──────────────────────────────────────────
# Pages environment only allows refs/heads/main — single push trigger satisfies this.
  build:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, security, data-safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /orthodox-calendar/
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
