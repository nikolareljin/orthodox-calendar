name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  security:
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      fail_on_findings: true

  data-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject sensitive keys in data files
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for f in backend/app/data/*.json; do
            [[ -f "$f" ]] || continue
            if grep -qiE '"(api_key|api_secret|password|passwd|token|secret|auth|cookie|session|credential|private_key)"\s*:' "$f"; then
              echo "::error::Potentially sensitive key found in $f"
              found=1
            fi
          done
          [[ $found -eq 0 ]] || exit 1
          echo "Data safety check passed."

  tag:
    needs: [security, data-safety]
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag-release.yml@production
    with:
      update_production_tag: false

  build:
    needs: [security, data-safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /orthodox-calendar/
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
