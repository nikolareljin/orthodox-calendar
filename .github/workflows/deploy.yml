name: Deploy

on:
  # Every push to main runs release-check (one gh api call, ~5 s, no-op for
  # non-release pushes). Only a merged release/* PR sets is_release=true and
  # unlocks the security gate and deploy stages.
  push:
    branches: [main]
  # Manual trigger for cases where release-check mis-fires (e.g. API 404 at
  # merge time or squash-fallback failure). Treats every manual run as a release.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

# Opt into Node.js 24 for JS actions. GitHub migration timeline:
#   2026-06-02 — Node 24 becomes the default runner-wide (this env var becomes a no-op)
#   Sep 2026   — Node 20 is fully removed from runners
# Set here at workflow env: scope rather than as a repo variable so the override
# lives with the code and needs no out-of-band setup.
# TODO: Remove this env block after 2026-06-02.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Serialize entire deploy runs so two rapid pushes to main (e.g. a release
# merge followed by a hotfix) do not race through release-check in parallel
# and then collide at the per-job concurrency groups.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
# ── Stage 0: detect if push came from a merged release/* PR ──────────────────
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Detect merged release/* PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_EVENT_FORCED: ${{ github.event.forced }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          is_release="false"

          # Guard: only deploy from refs/heads/main. Applies to both push and
          # workflow_dispatch (the UI/CLI let callers choose any ref for manual
          # runs, so this guard must come before the dispatch short-circuit).
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::notice::Ref is not refs/heads/main — release deploy skipped."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual dispatch on main always triggers a full release deploy.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "::notice::Manual workflow_dispatch on main — treating as release deploy."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Release deploy: true"
            exit 0
          fi

          # Guard: force-pushes can replay an old release SHA — skip and annotate
          # so the decision is visible in the workflow run history.
          if [[ "${GITHUB_EVENT_FORCED}" == "true" ]]; then
            echo "::notice::Force-push detected — release deploy skipped to prevent replaying an old release SHA."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Primary: GitHub API — reliable for standard and squash merges.
          # Limitation: if the API succeeds but returns 0 (e.g. squash/rebase
          # merge not yet indexed), api_ok stays true and only the merge-commit
          # subject fallback below acts as a secondary check. There is no
          # additional warning in that case; a manual re-run would catch it.
          api_ok=true
          count=0
          _api_err=$(mktemp)
          count=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            -F per_page=100 \
            --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release/")))] | length' \
            2>"${_api_err}") \
            || { echo "::warning::gh api call failed ($(< "${_api_err}")); relying on commit-message fallback"; count=0; api_ok=false; }
          rm -f "${_api_err}"
          count="${count:-0}"

          if [[ "${count}" -gt 0 ]]; then
            is_release="true"
          elif echo "${HEAD_COMMIT_MSG}" | grep -qE '^Merge pull request #[0-9]+ from [^ ]+/release/'; then
            # Fallback: standard merge-commit subject. [^ ]+ allows slashes so
            # fork-based PRs (fork-owner/release/x) are also matched.
            is_release="true"
          else
            # Squash-merge fallback: first line of subject ends with (#NNN).
            # head -n1 ensures only the commit subject is checked; the full
            # squash body may contain (#NNN) on other lines (e.g. PR refs in
            # bullet points) that would produce a multi-line _squash_pr and
            # break the subsequent API URL.
            _squash_pr=$(echo "${HEAD_COMMIT_MSG}" | head -n1 | grep -oE '\(#[0-9]+\)$' | tr -d '(#)' || true)
            if [[ -n "${_squash_pr}" ]]; then
              _squash_ref=$(gh api "repos/${{ github.repository }}/pulls/${_squash_pr}" \
                --jq '.head.ref' 2>/dev/null || echo "")
              if echo "${_squash_ref}" | grep -q '^release/'; then
                is_release="true"
              fi
            fi
          fi

          # API failed and no fallback matched: fail loudly if message hints at a
          # release branch so the run is re-runnable; otherwise warn only.
          if [[ "${is_release}" == "false" && "${api_ok}" == "false" ]]; then
            if echo "${HEAD_COMMIT_MSG}" | grep -qi 'release/'; then
              echo "::error::gh api failed on a commit that may be a release merge. Re-run the workflow to retry."
              exit 1
            else
              echo "::warning::gh api failed; no release pattern in commit message — assuming non-release push. Re-run if a deploy was expected."
            fi
          fi

          # Warn when API succeeded with 0 PRs but commit message hints at a
          # release/ branch — possible squash/rebase merge with delayed indexing.
          if [[ "${is_release}" == "false" && "${api_ok}" == "true" ]] \
              && echo "${HEAD_COMMIT_MSG}" | grep -qi 'release/'; then
            echo "::warning::API returned no release PRs but commit message contains 'release/' — possible squash/rebase merge with delayed indexing. Re-run if a deploy was expected."
          fi

          echo "is_release=${is_release}" >> "$GITHUB_OUTPUT"
          echo "Release deploy: ${is_release}"

# ── Stage 1: security gate (runs only on release merges) ─────────────────────
  security:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check]
    uses: nikolareljin/ci-helpers/.github/workflows/gitleaks-scan.yml@production
    with:
      fail_on_findings: true

  data-safety:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject sensitive keys in data files
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            if grep -qiE '"(api_key|api_secret|password|passwd|token|secret|auth|cookie|session|credential|private_key)"\s*:' "$f"; then
              echo "::error::Potentially sensitive key found in $f"
              found=1
            fi
          done < <(find backend/app/data -type f -name '*.json' -print0)
          [[ $found -eq 0 ]] || exit 1
          echo "Data safety check passed."

# ── Stage 2 (parallel): auto-tag ─────────────────────────────────────────────
# auto-tag-release.yml uses context.sha + listPullRequestsAssociatedWithCommit
# (not github.event.pull_request), so it works correctly under a push event.
  tag:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, security, data-safety]
    concurrency:
      group: release-tag
      cancel-in-progress: false
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag-release.yml@production
    with:
      update_production_tag: false

# ── Stage 2 (parallel): backend → Oracle Cloud ───────────────────────────────
  backend-deploy:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, security, data-safety]
    timeout-minutes: 15
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH agent
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.OCI_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Build minimal backend deployment archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/orthodox-calendar-backend.tar.gz \
              --exclude='*/__pycache__' \
              --exclude='*.py[co]' \
              backend/app \
              backend/requirements.txt

      - name: Deploy backend to Oracle Cloud
        shell: bash
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              /tmp/orthodox-calendar-backend.tar.gz \
              "${OCI_USER}@${OCI_HOST}:/tmp/orthodox-calendar-backend.tar.gz"
          _deploy_env="APP_DIR=/home/${OCI_USER}/orthodox-calendar RELEASE_ARCHIVE=/tmp/orthodox-calendar-backend.tar.gz"
          if [[ -n "${CERTBOT_EMAIL:-}" ]]; then
            printf -v _email_q '%q' "${CERTBOT_EMAIL}"
            _deploy_env="${_deploy_env} CERTBOT_EMAIL=${_email_q}"
          fi
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "${OCI_USER}@${OCI_HOST}" \
              "${_deploy_env} bash -s" \
              < deploy/oracle/deploy.sh

      - name: Verify backend health
        shell: bash
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          set -euo pipefail
          url="${VITE_API_BASE}/health"
          echo "Checking ${url}"
          for i in $(seq 1 6); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" "${url}" 2>/dev/null || echo "000")
            if [[ "${status}" == "200" ]]; then
              echo "Backend healthy (HTTP ${status})"
              exit 0
            fi
            echo "Attempt ${i}/6 — HTTP ${status}, waiting 10 s"
            sleep 10
          done
          echo "::error::Backend health check failed after 60 s"
          exit 1

# ── Stage 2 (parallel): frontend build → GitHub Pages ────────────────────────
# Pages environment only allows refs/heads/main — single push trigger satisfies this.
  build:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, security, data-safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /orthodox-calendar/
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

# ── Stage 3: Pages publish (after build) ──────────────────────────────────────
  deploy:
    if: needs.release-check.outputs.is_release == 'true'
    needs: [release-check, build, backend-deploy]
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
